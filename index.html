    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter"
      // This happens when a fetch polyfill runs in an environment where window.fetch is a getter.
      try {
        if (typeof window !== 'undefined') {
          const original = window.fetch;
          const desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && !desc.set && desc.configurable) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: desc.enumerable,
              get: function() { return original; },
              set: function(val) { /* no-op to prevent crash */ }
            });
          }
        }
      } catch (e) {
        console.warn('Could not patch window.fetch:', e);
      }
    </script>
